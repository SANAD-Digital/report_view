# vendored and generated files stay byte for byte: fonts and their licences, JSON
# fixtures, the generated @font-face sheet, lockfiles
exclude: |
    (?x)^(
        .*node_modules.*|
        \.git/.*|
        report_view/public/fonts/.*|
        report_view/public/css/rv_fonts\.css|
        .*/fixtures/.*\.json|
        .*package-lock\.json|
        yarn\.lock
    )$
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "report_view.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  # No Prettier: the JS and CSS were never formatted with it, and CI does not run it
  # (.github/workflows/ci.yml, job Lint: ruff and ESLint only).

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                report_view/public/dist/.*|
                tests/experiments/.*|
                tests/visual/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                report_view/templates/includes/.*|
                report_view/public/js/lib/.*
            )$

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
