<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report View — visual harness</title>
<script>
	// Same stylesheet order as Desk: Frappe's desk CSS (RTL build for Arabic), then the app.
	(function () {
		var lang = new URLSearchParams(location.search).get("lang") || "ar";
		var rtl = lang === "ar";
		document.documentElement.lang = lang;
		document.documentElement.dir = rtl ? "rtl" : "ltr";
		window.rv_add_css = function (href) {
			var l = document.createElement("link");
			l.rel = "stylesheet";
			l.href = href;
			document.head.appendChild(l);
		};
		window.rv_built = new URLSearchParams(location.search).get("built") === "1";
		["dist/desk-" + (rtl ? "rtl" : "ltr") + ".css", "dist/fonts.css"].forEach(window.rv_add_css);
		// ?built=1 uses the CSS and JS written by `bench build` instead of the sources.
		if (!window.rv_built) window.rv_add_css("dist/app.css");
	})();
</script>
<script src="dist/messages-ar.js"></script>
</head>
<body>
	<div class="page-container" id="page-report-view" data-page-route="report-view">
		<div class="page-body">
			<div class="layout-main">
				<div class="layout-main-section-wrapper">
					<div class="layout-main-section"></div>
				</div>
			</div>
		</div>
	</div>
	<script>
		(function () {
			function add(src, done) {
				var s = document.createElement("script");
				s.src = src;
				s.onload = done;
				document.body.appendChild(s);
			}
			if (!window.rv_built) return add("dist/harness.js");
			add("dist/harness_built.js", function () {
				fetch("/assets/assets.json")
					.then(function (r) {
						return r.json();
					})
					.then(function (assets) {
						window.rv_add_css(assets["report_view.bundle.css"]);
						add(assets["report_view.bundle.js"], function () {
							window.rv_start();
						});
					});
			});
		})();
	</script>
</body>
</html>
